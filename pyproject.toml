[project]
name = "SM-IAM"
version = "2.0.0"
description = "统一身份认证中心：用户、角色、MFA、OIDC/SSO 与会话管理"
requires-python = ">=3.11"

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
