# Kubernetes Deployment: SM IAM
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sm-iam
  namespace: sm-platform
  labels:
    app: sm-iam
    app.kubernetes.io/version: "2.1.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sm-iam
  template:
    metadata:
      labels:
        app: sm-iam
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8300"
    spec:
      serviceAccountName: sm-iam
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sm-iam
          image: ghcr.io/luoshitianchen/sm-iam:${IMAGE_TAG:-latest}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8300
          envFrom:
            - configMapRef:
                name: sm-iam-config
            - secretRef:
                name: sm-iam-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: sm-iam
                topologyKey: kubernetes.io/hostname
